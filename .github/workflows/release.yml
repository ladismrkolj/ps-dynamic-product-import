name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, curl, json, phar
          tools: composer:v2

      - name: Check tag matches config.xml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(php -r 'echo trim((string) simplexml_load_file("config.xml")->version);')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match config.xml version ${version}" >&2
            exit 1
          fi

      - name: Build package
        run: php bin/package.php --ref=HEAD --out=dist

      - uses: actions/upload-artifact@v4
        with:
          name: productimport
          path: dist/productimport-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/productimport-*.zip
